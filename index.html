<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Карта дня — Мария Таро</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #e0cfa0;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px; text-align: center;
        }
        .card-container {
            background: rgba(255, 255, 255, 0.05); border-radius: 24px;
            padding: 25px 20px; max-width: 380px; width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .card-image {
            width: 200px; height: auto; border-radius: 12px;
            margin: 0 auto 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: block;
        }
        .card-title { font-size: 22px; font-weight: bold; margin-bottom: 5px; color: #f5e6c8; }
        .card-position { font-size: 14px; opacity: 0.7; margin-bottom: 15px; }
        .card-text { font-size: 15px; line-height: 1.6; opacity: 0.85; margin-bottom: 20px; text-align: left; }
        .btn-affirmation {
            background: linear-gradient(145deg, #c9a84c, #b8902e); color: #1a1a2e;
            border: none; padding: 12px 30px; font-size: 16px; font-family: inherit;
            border-radius: 30px; cursor: pointer; font-weight: bold; width: 100%;
        }
        .status { margin-top: 15px; font-size: 13px; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="card-container">
        <img class="card-image" id="cardImage" src="https://telegram-demo-bot.github.io/maria-taro-miniapp/cards/Маг.jpg" alt="Карта дня">
        <div class="card-title" id="cardName">Маг</div>
        <div class="card-position" id="cardPosition">прямое положение</div>
        <div class="card-text" id="cardInterpretation">
            Сегодня ты обладаешь огромной силой. Всё, за что ты возьмёшься, будет получаться. Доверься своей интуиции — она подскажет верный путь.
        </div>
        <button class="btn-affirmation" id="btnAffirmation">🌟 Получить аффирмацию</button>
        <div class="status" id="tgStatus">Загружаю...</div>
    </div>

    <script>
        const statusEl = document.getElementById('tgStatus');
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready(); tg.expand();
            tg.setHeaderColor('#1a1a2e');
            tg.setBackgroundColor('#1a1a2e');
            statusEl.textContent = '✅ Подключено к Telegram';
        } else {
            statusEl.textContent = '❌ Откройте приложение через Telegram';
        }
        document.getElementById('btnAffirmation').addEventListener('click', () => {
            alert('Аффирмация появится после подключения к серверу. Скоро!');
        });
    </script>
</body>
</html>
