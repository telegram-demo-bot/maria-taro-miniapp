<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug</title>
    <style>
        body { background: #1a1a2e; color: #fff; font-family: monospace; padding: 20px; }
        ul { list-style: none; padding: 0; }
        li { margin: 8px 0; }
    </style>
</head>
<body>
    <h1>Debug Info</h1>
    <ul>
        <li><b>UserAgent:</b> <span id="ua"></span></li>
        <li><b>window.Telegram:</b> <span id="tg"></span></li>
        <li><b>window.Telegram.WebApp:</b> <span id="wa"></span></li>
        <li><b>initData (первые 100 символов):</b> <span id="init"></span></li>
    </ul>
    <script>
        document.getElementById('ua').textContent = navigator.userAgent;
        document.getElementById('tg').textContent = typeof window.Telegram;
        document.getElementById('wa').textContent = typeof (window.Telegram && window.Telegram.WebApp);
        var init = window.Telegram?.WebApp?.initData || '';
        document.getElementById('init').textContent = init.substring(0, 100) + (init.length > 100 ? '...' : '');
    </script>
</body>
</html>
